<div class="bg-surface border border-outline-variant rounded-xl p-6">
  <div class="mb-8 text-center">
    <h2 class="font-headline-md text-headline-md font-bold text-on-surface mb-1">Bienvenido al juego</h2>
    <p class="font-body-md text-body-md text-on-surface-variant">Ingresa tus credenciales para continuar</p>
  </div>

  <!-- El backend usa un único endpoint de login para todos los roles; el rol
       real viene del JWT y se valida contra este tab después del login (ver login.ts). -->
  <div class="flex p-1 bg-surface-container rounded-xl mb-6 border border-outline-variant">
    <button
      type="button"
      (click)="selectTab('jugador')"
      class="flex-1 py-2 px-4 rounded-lg font-label-md text-label-md font-semibold uppercase tracking-wider transition-all duration-200"
      [class.bg-primary]="selectedTab() === 'jugador'"
      [class.text-on-primary]="selectedTab() === 'jugador'"
      [class.shadow-md]="selectedTab() === 'jugador'"
      [class.text-on-surface-variant]="selectedTab() !== 'jugador'"
    >
      Jugador
    </button>
    <button
      type="button"
      (click)="selectTab('admin')"
      class="flex-1 py-2 px-4 rounded-lg font-label-md text-label-md font-semibold uppercase tracking-wider transition-all duration-200"
      [class.bg-primary]="selectedTab() === 'admin'"
      [class.text-on-primary]="selectedTab() === 'admin'"
      [class.shadow-md]="selectedTab() === 'admin'"
      [class.text-on-surface-variant]="selectedTab() !== 'admin'"
    >
      Administrador
    </button>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-6">
    <div class="space-y-1">
      <label for="username" class="font-label-md text-label-md font-semibold uppercase tracking-wider text-on-surface-variant">
        Usuario
      </label>
      <div class="relative flex items-center">
        <span class="material-symbols-outlined text-on-surface-variant absolute left-4">person</span>
        <input
          type="text"
          id="username"
          formControlName="username"
          placeholder="usuario123"
          autocomplete="username"
          class="w-full pl-[48px] pr-4 py-4 bg-surface-container border-b-2 border-outline-variant focus:border-primary focus:ring-0 transition-colors duration-200 outline-none font-body-md text-body-md"
        />
      </div>
    </div>

    <div class="space-y-1">
      <label for="password" class="font-label-md text-label-md font-semibold uppercase tracking-wider text-on-surface-variant">
        Contraseña
      </label>
      <div class="relative flex items-center">
        <span class="material-symbols-outlined text-on-surface-variant absolute left-4">lock</span>
        <input
          [type]="showPassword() ? 'text' : 'password'"
          id="password"
          formControlName="password"
          autocomplete="current-password"
          class="w-full pl-[48px] pr-[48px] py-4 bg-surface-container border-b-2 border-outline-variant focus:border-primary focus:ring-0 transition-colors duration-200 outline-none font-body-md text-body-md"
        />
        <button
          type="button"
          (click)="togglePasswordVisibility()"
          class="absolute right-4 text-on-surface-variant hover:text-primary transition-colors"
        >
          <span class="material-symbols-outlined">{{ showPassword() ? 'visibility_off' : 'visibility' }}</span>
        </button>
      </div>
    </div>

    <!-- Sin backend de recuperación de contraseña todavía -->
    <div class="flex justify-end">
      <a
        href="#"
        (click)="$event.preventDefault()"
        class="font-label-md text-label-md font-semibold text-secondary hover:underline"
      >
        ¿Olvidaste tu contraseña?
      </a>
    </div>

    @if (errorMessage()) {
      <p role="alert" class="font-label-md text-label-md text-error">{{ errorMessage() }}</p>
    }

    <button
      type="submit"
      [disabled]="form.invalid || loading()"
      class="w-full bg-primary text-on-primary py-4 rounded-lg font-label-md text-label-md font-semibold uppercase tracking-wider shadow-md hover:scale-[1.02] active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2 disabled:opacity-60 disabled:hover:scale-100"
    >
      {{ loading() ? 'Entrando...' : 'Iniciar sesión' }}
      <span class="material-symbols-outlined">login</span>
    </button>

    <div class="relative flex items-center py-4">
      <div class="flex-grow border-t border-outline-variant"></div>
      <span class="flex-shrink mx-4 text-label-md font-label-md text-on-surface-variant uppercase tracking-wider">o</span>
      <div class="flex-grow border-t border-outline-variant"></div>
    </div>

    <!-- Sin backend todavía (allauth sin wiring) -->
    <button
      type="button"
      title="Próximamente"
      disabled
      class="w-full bg-surface border border-outline-variant text-on-surface py-4 rounded-lg font-label-md text-label-md font-semibold uppercase tracking-wider shadow-md flex items-center justify-center gap-2 opacity-60 cursor-not-allowed"
    >
      <svg class="w-5 h-5" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
      </svg>
      Continuar con Google
    </button>
  </form>

  <div class="mt-8 pt-8 border-t border-outline-variant text-center">
    <p class="font-body-md text-body-md text-on-surface-variant">
      ¿No tienes una cuenta?
      <a
        routerLink="/auth/registro"
        class="text-primary font-label-md text-label-md font-semibold hover:underline transition-colors"
      >
        Regístrate
      </a>
    </p>
  </div>
</div>
